<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="srShieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="srShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181432" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090a16" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="srRouteLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="srNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Base -->
  <path
    d="M24 3.5 C13.5 3.5 7 8.5 7 18 C7 30.5 15.5 39.5 24 44.5 C32.5 39.5 41 30.5 41 18 C41 8.5 34.5 3.5 24 3.5 Z"
    fill="url(#srShieldBg)"
    stroke="url(#srShieldBorder)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Shield Inner Ring -->
  <path
    d="M24 7 C16 7 11 11 11 19 C11 28.5 18 36 24 40 C30 36 37 28.5 37 19 C37 11 32 7 24 7 Z"
    stroke="#b99bff"
    stroke-opacity="0.22"
    stroke-width="1"
    fill="none"
  />

  <!-- Dynamic Curved Route Line -->
  <path
    d="M17 34 C16 28, 30 29, 21 21 C17 17.5, 21 14, 24 13.5"
    stroke="url(#srRouteLine)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#srNeonGlow)"
  />

  <!-- Origin Waypoint -->
  <circle cx="17" cy="34" r="2.5" fill="#38bdf8" stroke="#090a16" stroke-width="1.2" />

  <!-- Mid-route Safety Waypoint -->
  <circle cx="21" cy="21" r="2" fill="#a855f7" stroke="#090a16" stroke-width="1.2" />

  <!-- Destination Beacon / Location Pin -->
  <g filter="url(#srNeonGlow)">
    <path
      d="M24 10 C21.79 10 20 11.79 20 14 C20 17 24 21.5 24 21.5 C24 21.5 28 17 28 14 C28 11.79 26.21 10 24 10 Z"
      fill="#00e5ff"
    />
    <circle cx="24" cy="14" r="1.5" fill="#090a16" />
  </g>
</svg>
